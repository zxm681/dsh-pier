# 临时 overlay：只为真机验证 dsh web 能否加载 dsh-vscode-kit。
# 用 `dsh --patch` 覆盖层注入，**不修改**任何 profile 文件。
- insert:
    - id: dsh-vscode-kit-realtest
      name: dsh-vscode-kit
      config:
        # 缩短等待，便于真机快速失败而不是默默等 30 秒
        connectWaitMs: 3000

# 示例消费者：验证「第三方插件只靠公开 API 就能用编辑器能力」这条主张。
- insert:
    - id: dsh-kit-demo-realtest
      name: dsh-kit-demo
      config:
        onLog: !!js "(m) => console.log('[dsh-kit-demo] ' + m)"
        smoke:
          path: 'D:\default-workspace\projects\dsh-vscode-dev\work\smoke-target.txt'
          outFile: 'D:\default-workspace\projects\dsh-vscode-dev\work\smoke-result.json'
